<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript and jQuery</title>

  <style>
    body {
      margin: 0;
      padding: 40px;
      background: #fff0f6;
      color: #4a1830;
      font-family: Arial, sans-serif;
    }

    main {
      max-width: 700px;
      margin: auto;
    }

    h1 {
      color: #ff1493;
    }

    #myElement, #myDIV {
      margin: 16px 0;
      padding: 18px;
      border: 1px solid #ffc1dc;
      border-radius: 12px;
      background: white;
    }

#myDIV.myStyle {
  background-color: coral;
  padding: 16px;
}

    button {
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #ff1493;
      color: white;
      cursor: pointer;
    }
  </style>

  <script src="https://code.jquery.com/jquery-4.0.0.min.js"></script>
</head>
<body>
  <main>
    <h1>JavaScript and jQuery</h1>

    <div id="myElement">Original Text</div>
    <div id="myDIV"><p>I am a myDIV.</p></div>
    <button id="myButton" type="button">Click me</button>
  </main>

  <script>
    $("#myElement").text("Modified Text");
    $("#myDIV").addClass("myStyle");

    $("#myButton").on("click", function () {
      alert("Button clicked!");
    });
  </script>
</body>
</html>
